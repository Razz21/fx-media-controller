// IMPORTANT: Start your code on the 2nd line
try {
  const Cc = Components.classes;
  const Ci = Components.interfaces;

  const scriptLoader = Cc[
    "@mozilla.org/moz/jssubscript-loader;1"
  ].getService(Ci.mozIJSSubScriptLoader);

  const ioService = Cc["@mozilla.org/network/io-service;1"].getService(
    Ci.nsIIOService
  );

  const profileDir = Cc["@mozilla.org/file/directory_service;1"]
    .getService(Ci.nsIProperties)
    .get("ProfD", Ci.nsIFile);

  const script = profileDir.clone();
  script.append("chrome");
  script.append("JS");
  script.append("fx-media-controller.js");

  const scriptURI = ioService.newFileURI(script).spec; 

  scriptLoader.loadSubScript(scriptURI, null, "UTF-8");
} catch (e) {
  Components.utils.reportError(e);
}